<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flip Card Deck</title>
<style>
  :root{
    --ink:#2C2C2B;
    --ink-2:#7D7A75;
    --canvas:transparent;
    --soft:#F9F8F7;
    --soft-2:#F0EFED;
    --border:#E6E5E3;
    --accent:#2783DE;
    --accent-soft:#E5F2FC;
    --card-w:190px;
    --card-h:270px;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:var(--sans);
    color:var(--ink);
    background:transparent;
  }

  /* ===== Component wrapper (drop-in for a larger page) ===== */
  .flipdeck{
    position:relative;
    width:100%;
    max-width:1120px;
    margin:0 auto;
    padding:24px 8px 28px;
  }
  .flipdeck__intro{
    display:flex;
    align-items:center;
    gap:10px;
    padding:0 20px 14px;
    color:var(--ink-2);
    font-size:13px;
    letter-spacing:.02em;
  }
  .flipdeck__intro .dot{
    width:6px;height:6px;border-radius:50%;background:var(--accent);
    flex:none;
  }
  .flipdeck__intro b{color:var(--ink);font-weight:600;}

  /* ===== Scroll viewport + track ===== */
  .deck-viewport{
    position:relative;
    width:100%;
    height:340px;
    overflow-x:auto;
    overflow-y:hidden;
    touch-action:pan-x;
    -webkit-overflow-scrolling:touch;
    scrollbar-width:thin;
    scrollbar-color:var(--border) transparent;
    cursor:default;
  }
  .deck-viewport.is-deck{overflow-x:hidden;cursor:default;}
  .deck-viewport.is-spread{cursor:grab;}
  .deck-viewport.is-dragging{cursor:grabbing;}
  .deck-viewport::-webkit-scrollbar{height:8px;}
  .deck-viewport::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
  .deck-viewport::-webkit-scrollbar-track{background:transparent;}

  .deck-track{
    position:relative;
    height:100%;
    width:100%;
  }

  /* ===== Card ===== */
  .card{
    position:absolute;
    top:50%;
    left:0;
    width:var(--card-w);
    height:var(--card-h);
    margin:0;padding:0;border:none;background:transparent;
    perspective:1200px;
    transform-origin:50% 100%;
    transition:transform .72s cubic-bezier(.22,.61,.36,1);
    will-change:transform;
    -webkit-tap-highlight-color:transparent;
    font-family:inherit;
    text-align:center;
  }
  .card:focus-visible{outline:none;}
  .card:focus-visible .card__inner{
    box-shadow:0 0 0 3px var(--accent-soft),0 0 0 4px var(--accent);
    border-radius:14px;
  }

  .card__inner{
    position:relative;
    width:100%;height:100%;
    transition:transform .6s cubic-bezier(.4,.02,.2,1);
    transform-style:preserve-3d;
  }
  .card.is-flipped .card__inner{transform:rotateY(180deg);}

  .face{
    position:absolute;
    inset:0;
    border-radius:14px;
    padding:22px 18px;
    display:flex;
    flex-direction:column;
    -webkit-backface-visibility:hidden;
    backface-visibility:hidden;
    border:1px solid var(--border);
    box-shadow:0 1px 2px rgba(0,0,0,.05),0 10px 24px rgba(0,0,0,.06);
    overflow:hidden;
  }
  .face--front{
    background:linear-gradient(160deg,#FFFFFF 0%,var(--soft) 100%);
  }
  .face--back{
    background:#6C71C5;
    color:#FFFFFF;
    border-color:rgba(255,255,255,.28);
    transform:rotateY(180deg);
  }

  .badge{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:30px;height:30px;
    border-radius:8px;
    font-size:13px;font-weight:700;
    letter-spacing:.01em;
    flex:none;
  }
  .face--front .badge{background:var(--soft-2);color:var(--ink);}

  .kicker{
    font-size:11px;
    text-transform:none;
    letter-spacing:.08em;
    color:var(--ink-2);
    margin:0 0 14px;
    font-weight:600;
  }
  .face--back .kicker{color:rgba(255,255,255,.86);}

  .headline{
    font-size:13px;
    line-height:1.25;
    font-weight:700;
    letter-spacing:.01em;
    color:var(--ink);
    margin:0 0 16px;
  }
  .qtext{
    font-size:16px;
    line-height:1.34;
    font-weight:600;
    color:var(--ink);
    margin:0;
  }
  .face--back .atext{color:#FFFFFF;}
  .face--back .atext.is-long{font-size:10.5px;line-height:1.27;}
  .atext{
    font-size:12px;
    line-height:1.34;
    color:var(--ink);
    margin:0;
    font-weight:400;
  }
  .face__body{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0;text-align:center;}
  .face__body .scroller{overflow:visible;min-height:0;display:flex;align-items:center;justify-content:center;text-align:center;}

  .hint{
    margin-top:auto;
    padding-top:12px;
    display:flex;align-items:center;gap:7px;
    font-size:11.5px;
    color:var(--ink-2);
    letter-spacing:.01em;
  }
  .hint svg{flex:none;}
  .face--back .hint{color:rgba(255,255,255,.88);}

  @media (max-width:480px){
    .flipdeck{padding:20px 0 24px;}
    .deck-viewport{height:340px;}
    .qtext{font-size:16px;}
    .flipdeck__intro{font-size:12px;padding:0 16px 14px;}
  }

  @media (prefers-reduced-motion:reduce){
    .card,.card__inner{transition-duration:.001ms;}
  }
</style>
</head>
<body>
  <section class="flipdeck" aria-label="Flip card deck">
    <div class="flipdeck__intro">
      <span class="dot" aria-hidden="true"></span>
      <span>Swipe or scroll sideways to explore the deck</span>
    </div>
    <div class="deck-viewport" id="viewport">
      <div class="deck-track" id="track"></div>
    </div>
  </section>

<script>
(function(){
  // ---- Placeholder content (swap in your real Q&A) ----
  var CARDS = [{"h": "RESEARCH", "q": "Does the hypothesis about the support artists need solve a real pain point?", "a": "<strong>YES</strong>. Dr. Wong's validated thesis confirmed the core problem, revealing a clear opportunity to build a seamless bridge between art education and professional practice."}, {"h": "RESEARCH → QUIZ (YEAR 1)", "q": "Do artists understand where they are now and what they need next?", "a": "<strong>NO</strong>. This established our ongoing proof of concept: artists lack clarity and actively seek out structured guidance to navigate their next career steps."}, {"h": "QUIZ → WEB (YEAR 2)", "q": "How do we make guidance accessible beyond research sessions?", "a": "<strong>Through actionable steps</strong>. While users valued curated materials, they struggled with application, highlighting the need for guided implementation over static links."}, {"h": "WEB → COMMUNITY (YEAR 3)", "q": "Do artists want community, structured guidance, or both?", "a": "<strong>Structured Guidance</strong>. Users engaged significantly more with expert leadership than with peers, proving that direct, expert-led direction was our core product offering."}, {"h": "COMMUNITY → PROGRAM (YEAR 4)", "q": "Can the product be maintained without constant design support?", "a": "<strong>YES</strong>. I transitioned our tech stack to a no-code solution, empowering the rest of the team to independently test and scale cohort programs without relying on my design availability."}, {"h": "PROGRAM → SCALE (YEAR 5)", "q": "How can we manage our product knowledge and tech stack faster as our system changes?", "a": "<strong>With a flexible architecture</strong>. I implemented an adaptable CMS to streamline updates, shifting the team's focus from website maintenance entirely to core product development."}, {"h": "SCALE → AI (YEAR 6)", "q": "Can AI scale expert guidance without flattening the artistic voice?", "a": "<strong>We'll see</strong>. We're leveraging AI as a coaching tool—providing targeted feedback on grant applications and artist statements to teach artists how to elevate their unique voice, rather than replacing it with generic outputs."}];

  var track = document.getElementById('track');
  var viewport = document.getElementById('viewport');
  var cards = [];

  var flipIcon = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4v6h6"/><path d="M21 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L3 8m18 8-2.64 2.36A9 9 0 0 1 3.51 15"/></svg>';

  CARDS.forEach(function(data,i){
    var num = String(i+1).padStart(2,'0');
    var card = document.createElement('button');
    card.className = 'card';
    card.type = 'button';
    card.setAttribute('aria-pressed','false');
    card.setAttribute('aria-label','Card '+num+'. Headline. Activate to reveal the answer.');
    card.innerHTML =
      '<div class="card__inner">'+
        '<div class="face face--front">'+
          '<div class="kicker">'+data.h.toUpperCase()+'</div>'+
          '<div class="face__body"><p class="qtext">'+data.q+'</p></div>'+
          '<div class="hint">'+flipIcon+'<span>Tap to reveal</span></div>'+
        '</div>'+
        '<div class="face face--back">'+
          '<div class="kicker">Answer</div>'+
          '<div class="face__body"><div class="scroller"><p class="atext '+(data.a.length>210?'is-long':'')+'">'+data.a+'</p></div></div>'+
          '<div class="hint">'+flipIcon+'<span>Tap to flip back</span></div>'+
        '</div>'+
      '</div>';
    track.appendChild(card);
    cards.push(card);
  });

  var N = cards.length;
  var GAP = 26;
  var PAD_X = 30;

  function cardW(){ return cards[0].offsetWidth; }

  // ---- Layout modes ----
  var mode = 'deck';

  function layoutDeck(){
    viewport.classList.add('is-deck');
    viewport.classList.remove('is-spread');
    var w = cardW();
    var vw = viewport.clientWidth;
    var centerX = (vw - w)/2;
    var mid = (N-1)/2;
    var stepX = 20;   // horizontal fan spacing (bottoms stay close)
    var stepDeg = 6.5; // rotation per step
    for(var i=0;i<N;i++){
      var d = i - mid;
      var angle = d * stepDeg;
      var tx = centerX + d * stepX;
      // slight downward nudge so the fan sits centered in the viewport
      var ty = -50;
      cards[i].style.transform =
        'translateX('+tx+'px) translateY('+ty+'%) rotate('+angle+'deg)';
      cards[i].style.zIndex = 100 + i;
    }
    track.style.width = '100%';
  }

  function layoutSpread(){
    viewport.classList.remove('is-deck');
    viewport.classList.add('is-spread');
    var w = cardW();
    var total = PAD_X*2 + N*w + (N-1)*GAP;
    var vw = viewport.clientWidth;
    // if everything fits, center the row within the viewport
    var startX = PAD_X;
    if(total < vw){ startX = (vw - (N*w + (N-1)*GAP))/2; }
    track.style.width = Math.max(total, vw) + 'px';
    for(var i=0;i<N;i++){
      var x = startX + i*(w+GAP);
      cards[i].style.transform =
        'translateX('+x+'px) translateY(-50%) rotate(0deg)';
      cards[i].style.zIndex = 10;
    }
  }

  function applyLayout(){
    if(mode==='spread') layoutSpread();
    else layoutDeck();
  }

  function setMode(next){
    if(mode===next) return;
    mode = next;
    applyLayout();
  }

  // ---- Forced mode for QA (?mode=deck|spread) ----
  var forced = null;
  try{
    var params = new URLSearchParams(location.search);
    var m = params.get('mode');
    if(m==='deck'||m==='spread') forced = m;
  }catch(e){}
  if(!forced && (window.QA_MODE==='deck'||window.QA_MODE==='spread')) forced = window.QA_MODE;

  // ---- In-view detection ----
  if(forced){
    mode = forced;
    applyLayout();
  } else {
    applyLayout(); // start as deck
    if('IntersectionObserver' in window){
      var io = new IntersectionObserver(function(entries){
        entries.forEach(function(en){
          setMode(en.isIntersecting && en.intersectionRatio>=0.35 ? 'spread':'deck');
        });
      },{threshold:[0,0.35,0.6]});
      io.observe(viewport);
    } else {
      setMode('spread');
    }
  }

  // ---- Flip handling ----
  function toggleFlip(card){
    var flipped = card.classList.toggle('is-flipped');
    card.setAttribute('aria-pressed', flipped ? 'true':'false');
  }

  // ---- Drag-to-scroll (mouse) without breaking clicks ----
  var isDown=false, moved=false, startX=0, startScroll=0;
  viewport.addEventListener('pointerdown', function(e){
    if(mode!=='spread') return;
    if(e.pointerType==='mouse' && e.button!==0) return;
    isDown=true; moved=false;
    startX=e.clientX; startScroll=viewport.scrollLeft;
  });
  viewport.addEventListener('pointermove', function(e){
    if(!isDown) return;
    var dx = e.clientX - startX;
    if(Math.abs(dx)>6){ moved=true; viewport.classList.add('is-dragging'); }
    if(moved){ viewport.scrollLeft = startScroll - dx; }
  });
  function endDrag(){
    isDown=false;
    viewport.classList.remove('is-dragging');
    // clear moved shortly after so the click handler can read it
    setTimeout(function(){ moved=false; }, 0);
  }
  viewport.addEventListener('pointerup', endDrag);
  viewport.addEventListener('pointercancel', endDrag);
  viewport.addEventListener('pointerleave', function(){ if(isDown) endDrag(); });

  cards.forEach(function(card){
    card.addEventListener('click', function(){
      if(moved) return; // was a drag, not a tap
      toggleFlip(card);
    });
  });

  // ---- Wheel: let vertical wheel scroll horizontally when hovering the row ----
  viewport.addEventListener('wheel', function(e){
    if(mode!=='spread') return;
    var canScroll = viewport.scrollWidth > viewport.clientWidth;
    if(!canScroll) return;
    if(Math.abs(e.deltaY) > Math.abs(e.deltaX)){
      viewport.scrollLeft += e.deltaY;
      e.preventDefault();
    }
  }, {passive:false});

  // ---- Resize ----
  var rt;
  window.addEventListener('resize', function(){
    clearTimeout(rt);
    rt = setTimeout(applyLayout, 120);
  });
})();
</script>
</body>
</html>
